# Supabase local development configuration.
project_id = "uni-streak"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
major_version = 16

[db.pooler]
enabled = true
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "unistreak://"
additional_redirect_urls = ["unistreak://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[storage]
enabled = true
# Enforced again per-bucket; see the storage migration.
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "oneshot"
